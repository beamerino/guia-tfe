{% extends "base.html" %}

{% block scripts %}
  {{ super() }}
  <script>
    /* «Volver» vuelve a la página anterior si venías de esta misma guía; si no, lleva al inicio. */
    document.querySelectorAll("[data-volver]").forEach(function (enlace) {
      enlace.addEventListener("click", function (evento) {
        try {
          var anterior = document.referrer ? new URL(document.referrer) : null;
          if (anterior && anterior.origin === location.origin && history.length > 1) {
            evento.preventDefault();
            history.back();
          }
        } catch (e) { /* si algo falla, el enlace lleva al inicio */ }
      });
    });
  </script>
{% endblock %}
